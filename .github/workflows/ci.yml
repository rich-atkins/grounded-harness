name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install grounded-mcp (bridge + demo dependency, not on PyPI)
        run: pip install "git+https://github.com/rich-atkins/grounded-mcp.git"
      - name: Install
        run: pip install -e . mcp pytest
      - name: Unit + integration tests
        run: pytest -q
      - name: The demo gate (green run)
        run: grounded-harness demo
      - name: Sabotage self-test (the gate must be able to fail)
        run: |
          if grounded-harness demo --sabotage broken-tool; then
            echo "sabotaged demo PASSED - the gate cannot fail"; exit 1; fi
          if grounded-harness demo --sabotage thin-evidence; then
            echo "thin-evidence demo PASSED - the floor is not enforced"; exit 1; fi
          echo "both sabotage directions correctly failed"
