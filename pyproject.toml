[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grounded-harness"
version = "0.1.0"
description = "An agent harness where evaluation is a runtime property: every run evaluated, every run resumable, every gate able to fail."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Richard Atkins" }]
requires-python = ">=3.10"
keywords = ["agents", "llm", "evals", "harness", "mcp", "anthropic", "trajectory-evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0", "mcp>=2.0", "grounded-mcp"]

[project.scripts]
grounded-harness = "grounded_harness.cli:main"

[project.urls]
Homepage = "https://github.com/rich-atkins/grounded-harness"
Issues = "https://github.com/rich-atkins/grounded-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
